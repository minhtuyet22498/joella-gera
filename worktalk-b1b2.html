<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkTalk – Tiếng Anh đi làm B1–B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#1C2B4A;--sub:#59647A;--line:#D7DEEA;--hv:#F6C343;--hv2:#D9A400;--onhv:#1C2B4A;--sky:#2F6FDE;--ok:#1E7650;--okbg:#E2F3E9;--bad:#B5371F;--badbg:#FBE6E1;--soft:#E4EAF5;
--fh:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10172A;--card:#19223A;--ink:#E8EDF6;--sub:#A0ABC2;--line:#2C3754;--sky:#86ACFF;--ok:#5FD49E;--okbg:#14322A;--bad:#FF8C75;--badbg:#3B1F1A;--soft:#222D48}}
:root[data-theme="dark"]{--bg:#10172A;--card:#19223A;--ink:#E8EDF6;--sub:#A0ABC2;--line:#2C3754;--sky:#86ACFF;--ok:#5FD49E;--okbg:#14322A;--bad:#FF8C75;--badbg:#3B1F1A;--soft:#222D48}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 var(--fb)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--fh);line-height:1.15;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:8px 16px 112px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--fh);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:14px;height:22px;background:var(--hv);border-radius:3px;transform:skewX(-12deg)}
.chips{margin-left:auto;display:flex;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);cursor:pointer;border-top:3px solid transparent}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--hv)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.note{color:var(--sub);font-size:15px;margin:8px 0}
.vi{color:var(--sub);font-size:15px;margin:2px 0 0}
.lv{display:inline-block;font-size:13px;font-weight:700;background:var(--soft);border-radius:6px;padding:1px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none}
.btn.hv{background:var(--hv);color:var(--onhv)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;color:var(--sky);font-weight:700;padding:10px 0;cursor:pointer}
.link{background:none;border:0;color:var(--sky);text-decoration:underline;cursor:pointer;padding:8px 4px}
/* hero */
.hero{margin:14px 0 6px}
.hero .day{font-size:15px;color:var(--sub);margin:0 0 6px}
.hero h1{font-size:clamp(30px,8.5vw,44px);font-weight:800;letter-spacing:-.02em}
.hero h1 span{display:block}
.hvbar{height:10px;border-radius:3px;margin:14px 0 4px;background:repeating-linear-gradient(-45deg,var(--hv) 0 12px,var(--onhv) 12px 24px);max-width:180px}
.plan{display:grid;gap:10px;margin:14px 0}
.task{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.task .ico{width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.task b{display:block;font-size:16px}
.task small{color:var(--sub);font-size:14px}
.task .st{font-size:13px;font-weight:700;color:var(--sub)}
.task.done .st{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--fh);font-size:26px;display:block}
.stat small{color:var(--sub);font-size:14px}
/* tickets */
.tickets{display:grid;gap:10px;margin:12px 0}
.ticket{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--hv);border-radius:12px;padding:12px 14px;cursor:pointer}
.ticket.done{border-left-color:var(--ok)}
.ticket .em{font-size:26px}
.ticket b{display:block;font-size:16.5px;line-height:1.3}
.ticket small{color:var(--sub);font-size:14px}
.ticket .ck{font-size:13px;font-weight:700;color:var(--ok)}
h1.pg{font-size:30px;font-weight:800;margin:14px 0 4px;letter-spacing:-.01em}
.schead h1{font-size:28px;font-weight:800;margin:6px 0 2px}
.ctx{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:4px;margin:12px 0}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.dbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0}
.tog{display:flex;gap:6px;align-items:center;font-size:15px;color:var(--sub);cursor:pointer}
.tog input{width:18px;height:18px}
ul.dlg{list-style:none;padding:0;margin:10px 0;display:grid;gap:10px}
ul.dlg li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
ul.dlg li.me{border:2px solid var(--hv)}
ul.dlg li.now{background:var(--soft)}
ul.dlg b{font-size:13px;color:var(--sub)}
.en{margin:2px 0 0;font-size:17.5px}
.acts{display:flex;gap:10px;align-items:center;margin-top:8px}
.playb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
/* the mic: hi-vis ring */
.mic{width:72px;height:72px;border-radius:50%;border:0;padding:6px;cursor:pointer;background:var(--hv);display:grid;place-items:center;flex:none}
.mic .core{width:100%;height:100%;border-radius:50%;background:var(--hv);color:var(--onhv);display:grid;place-items:center;border:3px solid var(--onhv)}
.mic.sm{width:48px;height:48px;padding:4px}
.mic.sm .core{border-width:2px}
.mic.sm svg{width:18px;height:18px}
.mic.rec{background:repeating-linear-gradient(-45deg,var(--hv) 0 7px,var(--onhv) 7px 14px);background-size:19.8px 19.8px;animation:hz .5s linear infinite}
@keyframes hz{to{background-position:19.8px 0}}
.mic.rec .core{background:#fff}
.res:empty{display:none}
.res{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:15.5px}
.res .sc{font-family:var(--fh);font-weight:800;font-size:24px;margin-right:8px}
.w{display:inline-block;margin:0 4px 2px 0;padding:0 3px;border-radius:4px}
.w.ok{background:var(--okbg);color:var(--ok)}
.w.miss{background:var(--badbg);color:var(--bad);text-decoration:underline wavy}
.heard{color:var(--sub);font-size:14px;margin:4px 0 0}
.phr{display:grid;gap:10px;margin:10px 0}
/* roleplay */
.bubble{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bubble b{font-size:13px;color:var(--sub);display:block}
.bubble p{margin:2px 0 0;font-size:18px}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16.5px;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--sky)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15.5px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb strong{display:block;margin-bottom:2px}
.say-it{margin-top:10px;display:flex;gap:12px;align-items:center}
/* grammar */
.form{font-family:var(--fh);font-weight:600;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:16.5px}
.ex{display:grid;gap:10px;margin:10px 0}
.exi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--hv)}
.qt{font-size:20px;font-weight:800}
.sec{font-size:14px;font-weight:700;color:var(--sub);margin:4px 0}
.qq{font-size:19px;margin:12px 0 4px}
.target{font-size:20px;font-family:var(--fh);font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.passage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;max-height:260px;overflow:auto}
.big{min-height:52px;font-size:17px}
.result{text-align:center;padding:12px 0}
.result .num{font-family:var(--fh);font-weight:800;font-size:56px;line-height:1}
.result .lvl{font-family:var(--fh);font-weight:800;font-size:34px;margin:8px 0}
.brk{display:grid;gap:8px;margin:14px 0;text-align:left}
.brk div{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-size:15px}
.brk .bar{margin:0}
/* vocab */
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:260px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;width:100%;margin:12px 0}
.flash .wd{font-family:var(--fh);font-weight:800;font-size:clamp(28px,8vw,40px)}
.flash .mean{font-size:20px;font-weight:700;margin:10px 0 4px}
.flash .exs{color:var(--sub)}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.wlist{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.wlist li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.wlist small{color:var(--sub)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pw{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:17px;font-weight:700;min-height:44px}
.pw svg{color:var(--sub)}
.game{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:9;max-width:90%;text-align:center}
.foot{color:var(--sub);font-size:13.5px;margin:22px 0 0}
textarea{width:100%;min-height:240px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:16px/1.6 var(--fb);background:var(--card);color:var(--ink);resize:vertical;margin-top:10px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15.5px;cursor:pointer}
.ck input{width:20px;height:20px;margin-top:2px;flex:none}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15.5px}
summary{cursor:pointer;font-weight:700}
.sample{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:12px;padding:12px 14px;font-size:15.5px}
.rub{display:grid;gap:12px;margin:10px 0}
.rub .lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rub button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 2px;font-size:13.5px;cursor:pointer;min-height:40px}
.rub button.on{background:var(--hv);border-color:var(--hv2);color:var(--onhv);font-weight:700}
.lq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.lq>p{margin:0 0 8px;font-weight:700}
.lq .opts{margin:0;gap:8px}
.opt.sel{border-color:var(--sky);background:var(--soft)}
.tin{width:100%;font:20px var(--fb);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.tin:focus{border-color:var(--sky);outline:none}
.grp{font-size:19px;margin:24px 0 2px}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="logo"><i></i>WorkTalk</div><div class="chips"><span class="chip" id="cStreak">🔥 0</span><span class="chip" id="cXp">0 XP</span></div></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Điều hướng"><div class="in">
<button data-t="home" onclick="go('home')"><span>🏠</span>Hôm nay</button>
<button data-t="sc" onclick="go('sc')"><span>💬</span>Nói</button>
<button data-t="ls" onclick="go('ls')"><span>🎧</span>Nghe</button>
<button data-t="wr" onclick="go('wr')"><span>✍️</span>Viết</button>
<button data-t="gr" onclick="go('gr')"><span>🧩</span>Ngữ pháp</button>
<button data-t="voc" onclick="go('voc')"><span>📇</span>Từ vựng</button>
<button data-t="test" onclick="go('test')"><span>📝</span>Thi thử</button>
</div></nav>

<script>
/* ===================== DATA: SCENARIOS ===================== */
const SC=[
{id:"first",e:"👋",lv:"B1",t:"First day at work",vi:"Ngày đầu đi làm",me:"Lan",c:"Bạn (Lan) gặp quản lý mới trong ngày đầu tiên. Mục tiêu: giới thiệu bản thân, hỏi ai sẽ hướng dẫn mình.",
d:[["David","Hi, you must be Lan. Welcome to the team! I'm David, the operations manager.","Chào, chắc em là Lan. Chào mừng vào nhóm! Anh là David, quản lý vận hành."],
["Lan","Nice to meet you, David. Thanks for having me. I've been looking forward to starting.","Rất vui được gặp anh. Cảm ơn đã nhận em. Em rất mong được bắt đầu."],
["David","Great. Let me show you around first, and then I'll introduce you to the others.","Tốt. Để anh dẫn em đi một vòng, rồi giới thiệu em với mọi người."],
["Lan","That sounds good. Who should I ask if I have questions about my tasks?","Nghe hay ạ. Nếu có thắc mắc về công việc thì em nên hỏi ai?"],
["David","Anna will be your buddy for the first two weeks. She's been here for five years.","Anna sẽ kèm em hai tuần đầu. Chị ấy làm ở đây năm năm rồi."],
["Lan","Perfect. I'll make sure to check in with her every morning.","Tuyệt. Em sẽ trao đổi với chị ấy mỗi sáng."]],
p:[["Thanks for having me.","Cảm ơn đã nhận/mời tôi."],["I've been looking forward to starting.","Tôi rất mong được bắt đầu."],["Who should I ask if I have questions?","Nếu có thắc mắc tôi nên hỏi ai?"],["Let me show you around.","Để tôi dẫn bạn đi tham quan."],["I'll make sure to check in with her.","Tôi sẽ nhớ trao đổi với cô ấy."]],
rp:[{s:"So, tell me a bit about yourself.",o:[["I'm Lan. I've worked in logistics for three years, and I'm excited to learn more here.",1,"Tốt: nói về kinh nghiệm làm việc và thái độ tích cực."],["I am Lan. I am 25 years old. I like music.",0,"Đúng ngữ pháp nhưng quá đơn giản (kiểu A1). Ở công sở nên nói về kinh nghiệm và công việc."],["Why do you want to know?",0,"Nghe phòng thủ và thiếu lịch sự."]]},
{s:"Do you have any questions so far?",o:[["No.",0,"Quá ngắn, có vẻ thiếu quan tâm. Hãy hỏi một câu thực tế."],["Yes. Could you tell me what time the team meeting usually starts?",1,"Tốt: câu hỏi gián tiếp lịch sự và có ích."],["Questions? I already know everything.",0,"Nghe kiêu ngạo, không phù hợp ngày đầu."]]},
{s:"Here's your desk. Is there anything else you need?",o:[["Give me the Wi-Fi password.",0,"Câu mệnh lệnh nghe cộc. Thêm Could I... please?"],["I need nothing.",0,"Không tự nhiên. Người bản xứ nói: I don't need anything else, thanks."],["Could I get the Wi-Fi password and access to the shared drive, please?",1,"Tốt: lịch sự và cụ thể."]]}]},

{id:"clarify",e:"🤔",lv:"B1",t:"Asking for clarification",vi:"Hỏi lại khi chưa hiểu",me:"Quang",c:"Quản lý giao việc nhanh. Bạn (Quang) cần hỏi lại cho chắc trước khi làm.",
d:[["Mark","Can you update the inventory sheet and send it to the warehouse by three?","Em cập nhật bảng tồn kho và gửi cho kho trước 3 giờ nhé?"],
["Quang","Sure. Just to make sure I understand, do you mean the weekly sheet or the monthly one?","Vâng. Để chắc là em hiểu đúng, ý anh là bảng tuần hay bảng tháng?"],
["Mark","The weekly one. And please highlight any items below fifty units.","Bảng tuần. Và tô đậm các mặt hàng dưới 50 đơn vị."],
["Quang","Got it. Sorry, could you repeat the last part? Below how many units?","Em hiểu rồi. Xin lỗi, anh nhắc lại phần cuối được không? Dưới bao nhiêu đơn vị ạ?"],
["Mark","Fifty. Five zero.","Năm mươi. Năm, không."],
["Quang","Thanks. So I'll highlight items below fifty and send it by three o'clock.","Cảm ơn anh. Vậy em sẽ tô các mặt hàng dưới 50 và gửi trước 3 giờ."]],
p:[["Just to make sure I understand, ...","Để chắc là tôi hiểu đúng, ..."],["Sorry, could you repeat the last part?","Xin lỗi, bạn nhắc lại phần cuối được không?"],["Do you mean the weekly sheet or the monthly one?","Ý bạn là cái này hay cái kia?"],["So, just to confirm, ...","Vậy, để xác nhận lại, ..."],["Could you say that again more slowly?","Bạn nói lại chậm hơn được không?"]],
rp:[{s:"Please process the returns before you leave.",o:[["Sorry, what do you mean by process exactly? Should I log them or refund them?",1,"Tốt: hỏi lại đúng chỗ chưa rõ và đưa lựa chọn cụ thể."],["What?",0,"Quá cộc. Dùng: Sorry, could you...?"],["OK.",0,"Chưa hiểu mà nói OK thì rất dễ làm sai. Hãy hỏi lại."]]},
{s:"And then check the labels and scan them into the system and update the tracker.",o:[["Speak slowly!",0,"Câu mệnh lệnh nghe thô. Thêm Sorry và Could you...?"],["Sorry, you're speaking a bit fast for me. Could you say that again more slowly?",1,"Tốt: lịch sự, có từ làm mềm a bit."],["Yes, yes.",0,"Giả vờ hiểu là lỗi giao tiếp phổ biến nhất."]]},
{s:"Any other questions?",o:[["So, just to confirm, I check the labels, scan them, and then update the tracker. Is that right?",1,"Rất tốt: tóm tắt lại để xác nhận. Kỹ năng quan trọng nhất ở B1."],["No questions.",0,"Nên tóm tắt lại nhiệm vụ để chắc chắn hiểu đúng."],["You explain badly.",0,"Đổ lỗi và thiếu tôn trọng."]]}]},

{id:"phone",e:"☎️",lv:"B1",t:"Taking a phone message",vi:"Nghe điện thoại và ghi lời nhắn",me:"Minh",c:"Bạn (Minh) nghe máy ở văn phòng. Người cần gặp đang bận, bạn ghi lời nhắn.",
d:[["Minh","Good morning, Sunrise Trading, Minh speaking. How can I help you?","Chào buổi sáng, Sunrise Trading, Minh nghe. Tôi có thể giúp gì?"],
["Sarah","Hi, this is Sarah Lee from Global Parts. Could I speak to Mr. Tan, please?","Chào, tôi là Sarah Lee từ Global Parts. Cho tôi gặp ông Tân được không?"],
["Minh","I'm afraid he's in a meeting right now. Would you like to leave a message?","Rất tiếc ông ấy đang họp. Chị có muốn để lại lời nhắn không?"],
["Sarah","Yes, please. Could you ask him to call me back about the delivery date?","Có. Nhờ anh bảo ông ấy gọi lại cho tôi về ngày giao hàng."],
["Minh","Of course. Could you spell your last name and give me your number, please?","Vâng. Chị đánh vần họ và cho tôi số điện thoại được không?"],
["Sarah","It's L, E, E, and my number is oh nine one two, three four five, six seven eight.","L-E-E, số tôi là 0912 345 678."],
["Minh","Thank you, Ms. Lee. I'll make sure he gets your message.","Cảm ơn chị Lee. Tôi sẽ chuyển lời nhắn cho ông ấy."]],
p:[["Minh speaking. How can I help you?","Minh nghe. Tôi giúp gì được ạ?"],["I'm afraid he's not available right now.","Rất tiếc ông ấy không có mặt lúc này."],["Would you like to leave a message?","Bạn có muốn để lại lời nhắn không?"],["Could you spell that, please?","Bạn đánh vần giúp được không?"],["I'll make sure he gets your message.","Tôi sẽ đảm bảo ông ấy nhận được lời nhắn."]],
rp:[{w:"Caller",s:"Hello, is Ms. Hoa there?",o:[["No. Bye.",0,"Quá cộc và làm mất khách."],["I'm afraid she's out of the office today. Can I take a message?",1,"Tốt: I'm afraid làm mềm tin xấu, rồi đề nghị giúp."],["She is not here, call later.",0,"Thiếu lịch sự. Nên đề nghị nhận lời nhắn."]]},
{w:"Caller",s:"My name is Brian Whitfield.",o:[["Your name is difficult.",0,"Bất lịch sự."],["OK, Brian Whitfeel.",0,"Đừng đoán tên. Hãy nhờ đánh vần."],["Sorry, could you spell your last name for me?",1,"Tốt: luôn xác nhận tên và số khi ghi lời nhắn."]]},
{w:"Caller",s:"That's all, thanks.",o:[["You're welcome. Thank you for calling. Have a nice day.",1,"Tốt: kết thúc cuộc gọi chuyên nghiệp."],["OK, bye bye.",0,"Quá thân mật cho cuộc gọi công việc."],["Is that all?",0,"Nghe như đang vội đuổi khách."]]}]},

{id:"standup",e:"📋",lv:"B1",t:"Daily stand-up update",vi:"Báo cáo tiến độ hằng ngày",me:"Huy",c:"Họp nhanh đầu ngày. Bạn (Huy) báo: hôm qua làm gì, hôm nay làm gì, đang vướng gì.",
d:[["Lead","Okay, let's start. Huy, what have you been working on?","Bắt đầu nhé. Huy, em đang làm gì?"],
["Huy","Yesterday I finished testing the new login page. Today I'm going to fix the two bugs we found.","Hôm qua em test xong trang đăng nhập mới. Hôm nay em sẽ sửa hai lỗi tìm được."],
["Lead","Great. Is anything blocking you?","Tốt. Có gì đang cản trở em không?"],
["Huy","Yes, actually. I'm still waiting for access to the test server.","Thật ra là có. Em vẫn đang chờ quyền truy cập máy chủ test."],
["Lead","I'll chase that up after the meeting. Anything else?","Anh sẽ hối việc đó sau họp. Còn gì nữa không?"],
["Huy","No, that's all from me. I should be done by Thursday.","Không, em hết rồi. Chắc thứ Năm em xong."]],
p:[["Yesterday I finished ...","Hôm qua tôi đã làm xong ..."],["Today I'm going to ...","Hôm nay tôi sẽ ..."],["I'm still waiting for ...","Tôi vẫn đang chờ ..."],["Is anything blocking you?","Có gì đang cản trở bạn không?"],["I should be done by Thursday.","Chắc thứ Năm tôi sẽ xong."]],
rp:[{s:"What did you do yesterday?",o:[["I finish pack orders.",0,"Sai thì: dùng quá khứ finished và V-ing sau finish: finished packing."],["I finished packing the Hanoi orders and checked the stock levels.",1,"Tốt: quá khứ đơn, nội dung cụ thể."],["Many things.",0,"Quá mơ hồ trong báo cáo."]]},
{s:"Any problems?",o:[["Yes. The label printer has been broken since Monday, so I'm writing labels by hand.",1,"Tốt: hiện tại hoàn thành + since, nêu rõ ảnh hưởng."],["Printer broken, not my fault!",0,"Thiếu ngữ pháp và nghe như đổ lỗi."],["Problem is printer.",0,"Thiếu thông tin: hỏng từ bao giờ, ảnh hưởng gì."]]},
{s:"When will it be done?",o:[["Maybe sometime.",0,"Quá mơ hồ. Hãy cho mốc thời gian và điều kiện."],["Don't know, don't ask me.",0,"Thiếu chuyên nghiệp."],["I should be done by Friday afternoon, if the printer gets fixed.",1,"Tốt: có mốc thời gian và điều kiện rõ."]]}]},

{id:"complaint",e:"😤",lv:"B1+",t:"Handling a customer complaint",vi:"Xử lý khiếu nại của khách",me:"Staff",c:"Khách gọi đến rất bực vì hàng chưa tới. Bạn là nhân viên chăm sóc khách hàng.",
d:[["Customer","I ordered a laptop two weeks ago, and it still hasn't arrived. This is unacceptable.","Tôi đặt laptop hai tuần trước mà vẫn chưa tới. Không thể chấp nhận được."],
["Staff","I'm really sorry to hear that. Could I have your order number, please?","Tôi rất tiếc về chuyện này. Cho tôi xin mã đơn hàng được không ạ?"],
["Customer","It's 48213. I've already called twice.","48213. Tôi gọi hai lần rồi."],
["Staff","I understand how frustrating that must be. Let me check. It seems the package was sent to the wrong warehouse.","Tôi hiểu chắc anh rất bực. Để tôi kiểm tra. Có vẻ gói hàng bị gửi nhầm kho."],
["Customer","So what are you going to do about it?","Vậy các anh sẽ làm gì?"],
["Staff","I'll arrange express delivery at no extra cost, and you should receive it by tomorrow. I'll also email you the tracking number.","Tôi sẽ sắp xếp giao nhanh miễn phí, anh sẽ nhận được trước ngày mai. Tôi cũng sẽ gửi email mã vận đơn."]],
p:[["I'm really sorry to hear that.","Tôi rất tiếc khi nghe điều đó."],["I understand how frustrating that must be.","Tôi hiểu điều đó chắc rất bực mình."],["Let me look into it for you.","Để tôi kiểm tra giúp bạn."],["What I can do is offer you a replacement.","Điều tôi có thể làm là đổi hàng mới cho bạn."],["at no extra cost","không tốn thêm phí"]],
rp:[{w:"Customer",s:"Your product broke after one day!",o:[["That's impossible. Our products are good.",0,"Phủ nhận làm khách giận hơn."],["I'm very sorry about that. Could you tell me what happened exactly?",1,"Tốt: xin lỗi trước, rồi hỏi thông tin."],["That's not my department.",0,"Đẩy trách nhiệm. Nếu không phải bộ phận mình, hãy nói sẽ chuyển giúp."]]},
{w:"Customer",s:"I want my money back. Now.",o:[["Calm down!",0,"Câu Calm down thường khiến khách bực hơn."],["I understand. I can offer you a full refund or a replacement. Which would you prefer?",1,"Tốt: thấu hiểu và đưa lựa chọn."],["You can't.",0,"Từ chối thẳng không giải thích."]]},
{w:"Customer",s:"This is the third time this has happened!",o:[["It's not a big deal.",0,"Xem nhẹ cảm xúc của khách."],["Third time? Wow.",0,"Nghe như mỉa mai."],["I completely understand your frustration. I'll personally follow up and make sure it doesn't happen again.",1,"Tốt: ghi nhận cảm xúc và cam kết hành động."]]}]},

{id:"delay",e:"⏰",lv:"B1",t:"Explaining a delay",vi:"Giải thích việc trễ hạn",me:"Trang",c:"Báo cáo của bạn (Trang) sẽ bị trễ. Cần báo quản lý một cách trung thực và đưa ra mốc mới.",
d:[["Manager","Hi Trang, how's the report coming along?","Chào Trang, báo cáo tới đâu rồi?"],
["Trang","I'm afraid it's going to be a bit late. The sales data arrived later than expected.","Em e là sẽ trễ một chút. Dữ liệu bán hàng đến muộn hơn dự kiến."],
["Manager","I see. When do you think you can finish it?","Ừ. Em nghĩ khi nào xong?"],
["Trang","I can have a first draft ready by tomorrow noon, and the final version by Friday.","Em có bản nháp trước trưa mai, bản cuối trước thứ Sáu."],
["Manager","Okay. Next time, please let me know as soon as there's a problem.","Được. Lần sau có vấn đề thì báo anh ngay nhé."],
["Trang","Absolutely. I should have told you earlier. Sorry about that.","Chắc chắn rồi ạ. Lẽ ra em nên báo sớm hơn. Em xin lỗi."]],
p:[["I'm afraid it's going to be a bit late.","Tôi e là sẽ trễ một chút."],["The data arrived later than expected.","Dữ liệu đến muộn hơn dự kiến."],["I can have it ready by Friday.","Tôi có thể làm xong trước thứ Sáu."],["I should have told you earlier.","Lẽ ra tôi nên báo sớm hơn."],["Please let me know as soon as there's a problem.","Có vấn đề thì báo tôi ngay nhé."]],
rp:[{w:"Manager",s:"Is the shipment ready?",o:[["Yes.",0,"Nói dối để tránh rắc rối sẽ gây rắc rối lớn hơn."],["Not yet, I'm afraid. Two items are out of stock, but we'll have them by Wednesday.",1,"Tốt: trung thực, nêu lý do và mốc mới."],["No.",0,"Đúng nhưng thiếu lý do và giải pháp."]]},
{w:"Manager",s:"Why didn't you tell me earlier?",o:[["You didn't ask.",0,"Nghe cãi lại."],["It's the supplier's fault, not mine.",0,"Đổ lỗi. Nên nhận phần trách nhiệm của mình."],["You're right, I should have told you earlier. I'll update you straight away next time.",1,"Tốt: should have + V3 để nhận lỗi, kèm cam kết."]]},
{w:"Manager",s:"Can you finish it today?",o:[["Honestly, today isn't realistic. But I can finish the most urgent part today and the rest tomorrow morning.",1,"Tốt: từ chối khéo và đưa phương án."],["Yes, of course!",0,"Hứa điều không làm được rồi lại trễ lần nữa."],["Impossible.",0,"Từ chối cụt lủn."]]}]},

{id:"leave",e:"🌴",lv:"B1",t:"Asking for time off",vi:"Xin nghỉ phép",me:"Nam",c:"Bạn (Nam) muốn xin nghỉ hai ngày để dự đám cưới em gái.",
d:[["Nam","Hi Jenny, do you have a minute? I'd like to ask about taking some time off.","Chào Jenny, chị có rảnh một phút không? Em muốn hỏi về việc xin nghỉ."],
["Jenny","Sure. When were you thinking?","Được. Em định nghỉ khi nào?"],
["Nam","Would it be possible to take Monday and Tuesday off next week? My sister is getting married.","Em có thể nghỉ thứ Hai và thứ Ba tuần sau không ạ? Em gái em cưới."],
["Jenny","Congratulations! That should be fine. Who will cover your tasks?","Chúc mừng nhé! Chắc là được. Ai sẽ làm thay việc của em?"],
["Nam","I've already talked to Phong. He's agreed to handle my customer emails.","Em đã nói với Phong rồi. Anh ấy đồng ý xử lý email khách hàng giúp em."],
["Jenny","Perfect. Just submit the request in the HR system, and I'll approve it.","Tốt. Em gửi đơn trên hệ thống nhân sự, chị sẽ duyệt."]],
p:[["Do you have a minute?","Bạn có rảnh một phút không?"],["Would it be possible to take Monday off?","Tôi có thể nghỉ thứ Hai được không?"],["Who will cover your tasks?","Ai sẽ làm thay việc của bạn?"],["He's agreed to handle my emails.","Anh ấy đã đồng ý xử lý email giúp tôi."],["Just submit the request in the system.","Chỉ cần gửi yêu cầu trên hệ thống."]],
rp:[{w:"Manager",s:"Hi Nam. What's up?",o:[["I don't come Friday.",0,"Sai ngữ pháp và nghe như thông báo, không phải xin phép."],["Hi, do you have a minute? I'd like to talk about taking a day off next Friday.",1,"Tốt: mở đầu lịch sự, nêu rõ mục đích."],["Friday I'm free, OK?",0,"Không rõ ý và thiếu lịch sự."]]},
{w:"Manager",s:"Hmm, Friday is a busy day. Is it urgent?",o:[["It's a family matter, but I could come in for the morning meeting if that helps.",1,"Tốt: giải thích ngắn và đưa phương án linh hoạt."],["Yes. I'm going anyway.",0,"Đối đầu, không có thiện chí."],["Not my problem.",0,"Thiếu chuyên nghiệp."]]},
{w:"Manager",s:"Who will do your work while you're away?",o:[["Nobody.",0,"Quản lý cần thấy bạn đã lên kế hoạch."],["I've asked Linh to cover my orders, and I'll finish the report before I leave.",1,"Tốt: đã sắp xếp người thay và cam kết hoàn thành."],["I don't know.",0,"Nên chuẩn bị sẵn người làm thay trước khi xin nghỉ."]]}]},

{id:"safety",e:"⚠️",lv:"B1",t:"Reporting a safety problem",vi:"Báo cáo sự cố an toàn",me:"Worker",c:"Ở xưởng, bạn phát hiện máy cắt bị lỏng tấm chắn. Báo ngay cho giám sát.",
d:[["Worker","Excuse me, Mr. Lim. I need to report a problem on line three.","Xin lỗi anh Lim. Em cần báo một sự cố ở dây chuyền số 3."],
["Mr. Lim","What's going on?","Có chuyện gì vậy?"],
["Worker","The guard on the cutting machine is loose. Someone could get hurt.","Tấm chắn trên máy cắt bị lỏng. Có người có thể bị thương."],
["Mr. Lim","Good catch. Has anyone been injured?","Phát hiện tốt. Có ai bị thương chưa?"],
["Worker","No, but I've stopped the machine and put a warning sign on it.","Chưa ạ, nhưng em đã dừng máy và đặt biển cảnh báo."],
["Mr. Lim","Well done. I'll call maintenance right away. Please fill in an incident report before the end of your shift.","Làm tốt lắm. Anh sẽ gọi bảo trì ngay. Em điền báo cáo sự cố trước khi hết ca nhé."]],
p:[["I need to report a problem on line three.","Tôi cần báo một sự cố ở dây chuyền 3."],["Someone could get hurt.","Có người có thể bị thương."],["I've stopped the machine.","Tôi đã dừng máy."],["Please fill in an incident report.","Vui lòng điền báo cáo sự cố."],["before the end of your shift","trước khi hết ca"]],
rp:[{w:"Supervisor",s:"Yes? What is it?",o:[["There's oil on the floor near the loading area. Someone might slip.",1,"Tốt: nêu vị trí và nguy cơ rõ ràng."],["Floor dirty.",0,"Thiếu thông tin: ở đâu, nguy hiểm gì."],["Nothing, never mind.",0,"Không báo sự cố an toàn là lỗi nghiêm trọng."]]},
{w:"Supervisor",s:"Did you do anything about it?",o:[["No, it's not my job.",0,"An toàn là việc của mọi người."],["Yes, I've put up a sign and blocked the area until it's cleaned.",1,"Tốt: hiện tại hoàn thành để báo việc đã làm."],["I watched it.",0,"Không có hành động cụ thể."]]},
{w:"Supervisor",s:"Good. How can we stop this from happening again?",o:[["Clean faster.",0,"Câu mệnh lệnh, chưa phải đề xuất."],["Maybe we should check the forklifts for leaks every morning.",1,"Tốt: đề xuất lịch sự với Maybe we should."],["Nothing.",0,"Bỏ lỡ cơ hội đóng góp ý kiến."]]}]},

{id:"interview",e:"💼",lv:"B2",t:"Job interview",vi:"Phỏng vấn xin việc",me:"Candidate",c:"Bạn phỏng vấn vị trí trưởng nhóm. Cần nói về vai trò hiện tại, thành tích và lý do ứng tuyển.",
d:[["Interviewer","Thanks for coming in. Could you start by telling us about your current role?","Cảm ơn bạn đã đến. Bạn có thể bắt đầu bằng việc kể về vị trí hiện tại không?"],
["Candidate","Of course. I'm currently a customer service team leader, where I manage a team of six people.","Vâng. Hiện tôi là trưởng nhóm chăm sóc khách hàng, quản lý sáu người."],
["Interviewer","What would you say is your biggest achievement?","Bạn cho rằng thành tích lớn nhất của mình là gì?"],
["Candidate","Last year, I introduced a new ticket system that reduced our response time by thirty percent.","Năm ngoái tôi triển khai hệ thống ticket mới giúp giảm 30% thời gian phản hồi."],
["Interviewer","Impressive. Why are you interested in this position?","Ấn tượng. Vì sao bạn quan tâm vị trí này?"],
["Candidate","I'm looking for a role with more international clients, and your company has a great reputation for training.","Tôi đang tìm vai trò làm với nhiều khách quốc tế hơn, và công ty anh chị nổi tiếng về đào tạo."]],
p:[["I'm currently a team leader, where I manage six people.","Hiện tôi là trưởng nhóm, quản lý sáu người."],["My biggest achievement was ...","Thành tích lớn nhất của tôi là ..."],["It reduced our response time by thirty percent.","Nó giảm 30% thời gian phản hồi."],["I'm looking for a role with more responsibility.","Tôi đang tìm vai trò có nhiều trách nhiệm hơn."],["I'd say my main strength is ...","Tôi cho rằng điểm mạnh chính của tôi là ..."]],
rp:[{w:"Interviewer",s:"What's your biggest weakness?",o:[["I have no weaknesses.",0,"Không thuyết phục. Nhà tuyển dụng muốn thấy bạn tự nhận thức."],["I sometimes spend too long on details, so I now set time limits for each task.",1,"Tốt: điểm yếu thật + cách đang khắc phục."],["I'm lazy in the morning.",0,"Điểm yếu gây hại trực tiếp cho công việc."]]},
{w:"Interviewer",s:"Why did you leave your last job?",o:[["My boss was terrible.",0,"Không bao giờ nói xấu sếp cũ trong phỏng vấn."],["Money.",0,"Quá cộc và chỉ tập trung vào tiền."],["I'd learned a lot there, but I was ready for new challenges and more responsibility.",1,"Tốt: tích cực, hướng về phía trước."]]},
{w:"Interviewer",s:"Do you have any questions for us?",o:[["Yes. What would a typical day in this role look like?",1,"Tốt: cho thấy bạn quan tâm thật sự đến công việc."],["No.",0,"Bỏ lỡ cơ hội gây ấn tượng."],["How many days off do I get?",0,"Nên hỏi về công việc trước, phúc lợi sau."]]}]},

{id:"disagree",e:"🤝",lv:"B2",t:"Disagreeing politely",vi:"Phản đối một cách lịch sự",me:"Dev",c:"Quản lý muốn ra mắt sản phẩm quá sớm. Bạn không đồng ý nhưng cần giữ quan hệ tốt và đưa giải pháp.",
d:[["Manager","I think we should launch the new app next Monday.","Tôi nghĩ ta nên ra mắt app mới vào thứ Hai tới."],
["Dev","I see your point, but I'm not sure we're ready. We still have several bugs to fix.","Tôi hiểu ý anh, nhưng tôi không chắc ta đã sẵn sàng. Vẫn còn vài lỗi cần sửa."],
["Manager","But the client is expecting it next week.","Nhưng khách đang chờ vào tuần sau."],

{id:"c1-vendor",e:"💼",lv:"C1",t:"Negotiating an ERP licence",vi:"Đàm phán giá license ERP",me:"Linh",c:"Bạn (Linh) đại diện công ty đàm phán với nhà cung cấp ERP. Báo giá đang cao hơn ngân sách khoảng 15%. Mục tiêu: giảm giá mà vẫn giữ quan hệ tốt, và có thêm đào tạo người dùng.",
d:[["Mark","Thanks for your time, Linh. Have you had a chance to review our proposal?","Cảm ơn chị đã dành thời gian. Chị đã xem đề xuất của chúng tôi chưa?"],
["Linh","We have, and we're impressed with the product. That said, the licence fee is around fifteen percent above our budget.","Rồi, và chúng tôi đánh giá cao sản phẩm. Dù vậy, phí license cao hơn ngân sách khoảng 15%."],
["Mark","I understand, but the price reflects the level of local support we provide.","Tôi hiểu, nhưng mức giá phản ánh mức hỗ trợ tại chỗ chúng tôi cung cấp."],
["Linh","We appreciate that. However, we've received a comparable offer from another vendor. Would there be any flexibility on the price if we signed a three-year contract?","Chúng tôi trân trọng điều đó. Tuy nhiên, chúng tôi đã nhận báo giá tương đương từ nhà cung cấp khác. Có thể linh hoạt về giá nếu ký hợp đồng 3 năm không?"],
["Mark","Possibly. If you commit to three years, we could reduce the fee by eight percent.","Có thể. Nếu cam kết 3 năm, chúng tôi giảm được 8%."],
["Linh","That's a step in the right direction. Could you also include training for our end users? That would make it much easier to get approval internally.","Đó là bước tiến đúng hướng. Anh có thể thêm đào tạo người dùng cuối không? Như vậy việc phê duyệt nội bộ sẽ dễ hơn nhiều."]],
p:[["That said, the fee is above our budget.","Dù vậy, mức phí cao hơn ngân sách."],["Would there be any flexibility on the price if we signed a longer contract?","Có thể linh hoạt về giá nếu chúng tôi ký hợp đồng dài hơn không?"],["We've received a comparable offer from another vendor.","Chúng tôi đã nhận báo giá tương đương từ nhà cung cấp khác."],["That's a step in the right direction.","Đó là một bước tiến đúng hướng."],["That would make it much easier to get approval internally.","Điều đó giúp việc phê duyệt nội bộ dễ hơn nhiều."]],
rp:[{w:"Mark",s:"This is our best price. We can't go any lower.",o:[["I understand. Before we close the door on price, could we look at other variables, such as payment terms or the length of the contract?",1,"Tốt: không đối đầu, mở rộng các biến số đàm phán ngoài giá."],["Then we'll have to go with the other vendor.",0,"Dọa rút lui quá sớm làm mất cơ hội đàm phán. Chỉ dùng khi đó thật sự là phương án thay thế (BATNA)."],["OK, we accept.",0,"Chấp nhận ngay khiến bạn bỏ lỡ các nhượng bộ khác như đào tạo, hỗ trợ, điều khoản thanh toán."]]},
{w:"Mark",s:"If we give you the discount, we'd need payment upfront.",o:[["Upfront payment would be difficult for our cash flow. Would you consider quarterly payments in return for a longer commitment?",1,"Tốt: nêu lý do và đề xuất trao đổi, mỗi nhượng bộ đổi lấy một điều kiện."],["No, that's impossible.",0,"Từ chối cứng, không đưa phương án."],["Fine, whatever you need.",0,"Nhượng bộ mà không đổi lại gì."]]},
{w:"Mark",s:"So, do we have a deal?",o:[["We're close. Let me summarise what we've agreed, and I'll confirm in writing once I've spoken to our CFO.",1,"Tốt: tóm tắt thỏa thuận và xin phê duyệt nội bộ, không cam kết vượt thẩm quyền."],["Yes, definitely. Let's sign now.",0,"Cam kết khi chưa có phê duyệt nội bộ là rủi ro."],["Maybe. I don't know.",0,"Thiếu rõ ràng, làm đối tác mất niềm tin."]]}]},
{id:"c1-scope",e:"🧭",lv:"C1",t:"Handling a late change request",vi:"Xử lý yêu cầu thay đổi phút chót",me:"Huy",c:"Bạn (Huy) là trưởng dự án ERP. Ngay trước go-live, khách muốn thêm báo cáo hợp nhất. Bạn cần giữ quan hệ tốt nhưng không để phình phạm vi.",
d:[["Ms. Tan","Huy, we'd like to add the consolidation report before go-live. It's essential for our board.","Huy, chúng tôi muốn thêm báo cáo hợp nhất trước go-live. Nó rất quan trọng với hội đồng quản trị."],
["Huy","I understand why it matters. Just to be clear, it wasn't part of the original scope, so we'd need to handle it through a change request.","Tôi hiểu vì sao nó quan trọng. Để rõ ràng, việc này không nằm trong phạm vi ban đầu, nên cần đi qua quy trình yêu cầu thay đổi."],
["Ms. Tan","But surely it's a small change?","Nhưng chắc đây chỉ là thay đổi nhỏ chứ?"],
["Huy","Unfortunately not. It affects the data model and the intercompany process, so our initial estimate is around fifteen days of work.","Tiếc là không. Nó ảnh hưởng mô hình dữ liệu và quy trình giao dịch nội bộ, ước tính ban đầu khoảng 15 ngày công."],
["Ms. Tan","We can't move go-live. The auditors arrive in March.","Chúng tôi không thể dời go-live. Kiểm toán đến vào tháng 3."],
["Huy","Then I'd suggest we go live on schedule with the current scope and deliver the report in phase two, in time for the March audit.","Vậy tôi đề xuất go-live đúng hạn với phạm vi hiện tại và giao báo cáo ở giai đoạn 2, kịp đợt kiểm toán tháng 3."]],
p:[["Just to be clear, it wasn't part of the original scope.","Để rõ ràng, việc này không nằm trong phạm vi ban đầu."],["We'd need to handle it through a change request.","Chúng ta cần xử lý qua yêu cầu thay đổi."],["It affects the data model.","Nó ảnh hưởng đến mô hình dữ liệu."],["Our initial estimate is around fifteen days of work.","Ước tính ban đầu là khoảng 15 ngày công."],["I'd suggest we go live on schedule with the current scope.","Tôi đề xuất go-live đúng hạn với phạm vi hiện tại."]],
rp:[{w:"Ms. Tan",s:"Can't your team just add it quickly? It's only one report.",o:[["I'd love to help, but it touches several processes. Let me do a quick impact analysis so we can decide based on facts.",1,"Tốt: không từ chối thẳng, đưa về đánh giá tác động."],["Sure, we'll squeeze it in.",0,"Nhận thêm việc mà không đánh giá là nguyên nhân phổ biến của phình phạm vi và trễ go-live."],["No. It's not in the contract.",0,"Đúng về hợp đồng nhưng nghe cứng nhắc, làm xấu quan hệ."]]},
{w:"Ms. Tan",s:"Who's going to pay for these extra days?",o:[["That's something we'd need to agree on. One option is to share the cost, since the requirement emerged late on both sides.",1,"Tốt: mở phương án, dùng 'One option is' để mềm mỏng."],["You will, obviously.",0,"Thiếu ngoại giao."],["Don't worry, it's free.",0,"Làm miễn phí tạo tiền lệ xấu cho các yêu cầu sau."]]},
{w:"Ms. Tan",s:"OK. What do you need from us?",o:[["We'd need written sign-off on the change request and a decision on the timeline by Friday, so that we can plan resources.",1,"Tốt: yêu cầu cụ thể, có hạn chót và lý do."],["Nothing, we'll handle it.",0,"Thiếu phê duyệt bằng văn bản là rủi ro tranh chấp sau này."],["Just trust us.",0,"Không chuyên nghiệp trong quản lý dự án."]]}]},
{id:"c1-cfo",e:"📊",lv:"C1",t:"Explaining results to the CFO",vi:"Giải trình kết quả với CFO",me:"Mai",c:"Bạn (Mai) là trưởng phòng kế toán, trình bày kết quả khóa sổ tháng cho CFO. Chi phí vượt kế hoạch và có chênh lệch khi đối chiếu ngân hàng.",
d:[["Mr. Wong","Mai, walk me through the month-end results.","Mai, trình bày cho tôi kết quả khóa sổ tháng."],
["Mai","Certainly. Overall, revenue was in line with the forecast, but operating expenses came in four percent over budget.","Vâng. Nhìn chung doanh thu sát dự báo, nhưng chi phí hoạt động vượt ngân sách 4%."],
["Mr. Wong","What's driving the variance?","Điều gì gây ra chênh lệch?"],
["Mai","It's mainly marketing. The trade fair costs were booked this month rather than spread over the quarter, so it's a timing difference rather than overspending.","Chủ yếu là marketing. Chi phí hội chợ ghi nhận hết trong tháng này thay vì phân bổ cho cả quý, nên đây là chênh lệch thời điểm, không phải chi vượt."],
["Mr. Wong","And the bank reconciliation? I heard there was an issue.","Còn đối chiếu ngân hàng? Tôi nghe nói có vấn đề."],
["Mai","There's a discrepancy of around twelve thousand dollars, which we've traced to duplicate supplier payments. We've already contacted the supplier and expect a refund by the end of next week.","Có khoản chênh khoảng 12.000 đô, chúng tôi đã tìm ra là do thanh toán trùng cho nhà cung cấp. Chúng tôi đã liên hệ và dự kiến nhận hoàn tiền trước cuối tuần sau."]],
p:[["Overall, revenue was in line with the forecast.","Nhìn chung doanh thu sát với dự báo."],["Operating expenses came in four percent over budget.","Chi phí hoạt động vượt ngân sách 4%."],["It's a timing difference rather than overspending.","Đây là chênh lệch thời điểm, không phải chi vượt."],["We've traced it to duplicate payments.","Chúng tôi đã tìm ra nguyên nhân là thanh toán trùng."],["Let me walk you through the figures.","Để tôi trình bày lần lượt các số liệu."]],
rp:[{w:"Mr. Wong",s:"Why didn't anyone flag this earlier?",o:[["That's a fair point. We spotted it during reconciliation on day two, and going forward we'll run a duplicate-payment check every week.",1,"Tốt: nhận góp ý, giải thích ngắn và đưa biện pháp phòng ngừa."],["It's not my team's fault.",0,"Phòng thủ, đổ lỗi."],["I don't know.",0,"Thiếu trách nhiệm giải trình."]]},
{w:"Mr. Wong",s:"Will this affect our quarterly forecast?",o:[["Only marginally. Once the refund comes in, the impact on the quarter should be less than half a percent.",1,"Tốt: trả lời thẳng, có số liệu, dùng 'should' để rào đón."],["Maybe, maybe not.",0,"Mơ hồ, không có số liệu."],["Yes, it's a disaster.",0,"Phóng đại, gây hoang mang."]]},
{w:"Mr. Wong",s:"What do you need from me?",o:[["Just your approval to tighten the payment workflow, so that payments over ten thousand dollars need a second sign-off.",1,"Tốt: yêu cầu rõ, có ngưỡng cụ thể."],["Nothing really.",0,"Bỏ lỡ cơ hội xin hỗ trợ để khắc phục gốc rễ."],["More staff, please.",0,"Yêu cầu không gắn với vấn đề vừa nêu."]]}]},
{id:"c1-lead",e:"🧑‍💼",lv:"C1",t:"A difficult conversation with your team",vi:"Góp ý thẳng với nhân viên",me:"Nam",c:"Bạn (Nam) là trưởng nhóm. Khoa trễ hạn liên tục hai tháng. Bạn cần góp ý thẳng nhưng tôn trọng, tìm nguyên nhân và cùng thống nhất kế hoạch.",
d:[["Nam","Thanks for making time, Khoa. I wanted to talk about the last two months. I've noticed that several deadlines have slipped, including the vendor reconciliation.","Cảm ơn Khoa đã dành thời gian. Anh muốn nói về hai tháng vừa qua. Anh thấy nhiều hạn chót bị trễ, kể cả việc đối chiếu nhà cung cấp."],
["Khoa","I know. I've been struggling to keep up.","Em biết. Em đang xoay xở không kịp."],
["Nam","I appreciate you being honest. Can you help me understand what's getting in the way?","Cảm ơn em đã thẳng thắn. Em giúp anh hiểu điều gì đang cản trở được không?"],
["Khoa","Since the ERP go-live, I've been answering a lot of user questions, so my own tasks keep getting pushed back.","Từ khi go-live ERP, em phải trả lời rất nhiều câu hỏi của người dùng, nên việc của em cứ bị đẩy lùi."],
["Nam","That's useful to know. Let's agree on a plan. I'll ask the support team to take over first-line questions, and you focus on reconciliations. Does that sound workable?","Thông tin này hữu ích. Mình thống nhất kế hoạch nhé. Anh sẽ nhờ nhóm hỗ trợ nhận các câu hỏi đầu tiên, em tập trung đối chiếu. Như vậy có khả thi không?"],
["Khoa","Yes, that would really help.","Dạ, như vậy giúp em nhiều lắm."]],
p:[["I've noticed that several deadlines have slipped.","Tôi nhận thấy nhiều hạn chót đã bị trễ."],["Can you help me understand what's getting in the way?","Bạn giúp tôi hiểu điều gì đang cản trở được không?"],["I appreciate you being honest.","Cảm ơn bạn đã thẳng thắn."],["Let's agree on a plan.","Hãy cùng thống nhất một kế hoạch."],["Does that sound workable?","Như vậy có khả thi với bạn không?"]],
rp:[{w:"Khoa",s:"Is something wrong? You wanted to see me.",o:[["Nothing serious, but I'd like to talk about some missed deadlines and see how I can support you.",1,"Tốt: nêu thẳng chủ đề, giọng hỗ trợ, không buộc tội."],["Yes. Your work has been terrible.",0,"Công kích con người thay vì nói về hành vi cụ thể."],["Oh, nothing, just a chat.",0,"Né tránh vấn đề khiến buổi nói chuyện mất tác dụng."]]},
{w:"Khoa",s:"Honestly, everyone else is late too.",o:[["That may be true, and I'll look at that separately. Right now I'd like to focus on your workload and what would help you.",1,"Tốt: ghi nhận nhưng đưa cuộc nói chuyện về đúng trọng tâm."],["That's no excuse.",0,"Đúng nhưng đóng cửa đối thoại."],["Really? Who?",0,"Lạc đề, biến buổi góp ý thành buổi tố cáo."]]},
{w:"Khoa",s:"OK. So what happens now?",o:[["Let's meet again in two weeks to review progress. If anything gets in the way before then, come to me straight away.",1,"Tốt: có mốc theo dõi và mở kênh hỗ trợ."],["Nothing. Just do better.",0,"Không có kế hoạch theo dõi cụ thể."],["If it happens again, you're out.",0,"Đe dọa làm mất niềm tin, không phải cách lãnh đạo hiệu quả."]]}]},
{id:"c1-steer",e:"🏛️",lv:"C1",t:"Go/no-go at the steering committee",vi:"Khuyến nghị go/no-go với ban chỉ đạo",me:"Trang",c:"Bạn (Trang) là quản lý dự án, trình bày khuyến nghị go-live cho ban chỉ đạo ERP. Còn 3 lỗi nghiêm trọng ở phân hệ thanh toán.",
d:[["Mr. Lee","Trang, are we ready to go live next month?","Trang, tháng sau chúng ta go-live được chưa?"],
["Trang","My recommendation is a conditional go. Ninety-five percent of test cases have passed, but three critical defects remain open in the payment module.","Khuyến nghị của tôi là go-live có điều kiện. 95% kịch bản kiểm thử đã đạt, nhưng còn 3 lỗi nghiêm trọng ở phân hệ thanh toán."],
["Mr. Lee","How confident are you that they'll be fixed in time?","Chị tự tin đến đâu là sẽ sửa kịp?"],
["Trang","The vendor has committed to fixing them by the fifteenth. If they're not resolved by then, we'd postpone by two weeks rather than risk incorrect supplier payments.","Nhà cung cấp cam kết sửa trước ngày 15. Nếu không xong, chúng ta sẽ dời hai tuần thay vì chấp nhận rủi ro thanh toán sai cho nhà cung cấp."],
["Mr. Lee","Two weeks would mean missing the start of the quarter.","Dời hai tuần nghĩa là lỡ đầu quý."],
["Trang","That's true, and I'm aware of the impact. However, going live with errors in payments would be far more costly, both financially and for our reputation with suppliers.","Đúng vậy, và tôi hiểu ảnh hưởng đó. Tuy nhiên, go-live với lỗi thanh toán sẽ tốn kém hơn nhiều, cả về tài chính lẫn uy tín với nhà cung cấp."]],
p:[["My recommendation is a conditional go.","Khuyến nghị của tôi là go-live có điều kiện."],["Three critical defects remain open.","Còn 3 lỗi nghiêm trọng chưa xử lý."],["The vendor has committed to fixing them by the fifteenth.","Nhà cung cấp cam kết sửa trước ngày 15."],["rather than risk incorrect payments","thay vì chấp nhận rủi ro thanh toán sai"],["far more costly, both financially and for our reputation","tốn kém hơn nhiều, cả tài chính lẫn uy tín"]],
rp:[{w:"Mr. Lee",s:"Just give me a yes or no. Are we going live?",o:[["Yes, on the condition that the three critical defects are closed by the fifteenth. If not, I'll recommend a two-week delay.",1,"Tốt: trả lời thẳng nhưng giữ điều kiện rõ ràng."],["It's complicated. There are many factors...",0,"Lãnh đạo cần câu trả lời rõ ràng, không vòng vo."],["Yes, everything is fine.",0,"Che giấu rủi ro trước ban chỉ đạo là sai lầm nghiêm trọng."]]},
{w:"Mr. Lee",s:"The board won't be happy with a delay.",o:[["I understand. I'd rather explain a two-week delay now than explain incorrect supplier payments later.",1,"Tốt: so sánh hai rủi ro để thuyết phục."],["That's not my problem.",0,"Thiếu tinh thần trách nhiệm chung."],["Then we'll go live anyway.",0,"Đổi khuyến nghị chỉ vì áp lực làm mất uy tín chuyên môn."]]},
{w:"Mr. Lee",s:"What do you need from this committee?",o:[["Two things: approval for the conditional go, and your support in communicating a possible delay to the board.",1,"Tốt: nêu chính xác hai việc cần ban chỉ đạo quyết."],["Nothing, we're fine.",0,"Bỏ lỡ cơ hội nhận hỗ trợ từ cấp cao."],["More budget.",0,"Yêu cầu không gắn với vấn đề đang bàn."]]}]},
{id:"c1-escalate",e:"🚨",lv:"C1",t:"Calming an angry client after go-live",vi:"Xử lý khách hàng giận sau go-live",me:"Quan",c:"Sau go-live, hệ thống xuất 200 hóa đơn sai thuế VAT. Giám đốc khách hàng rất bực. Bạn (Quan) cần nhận trách nhiệm, đưa kế hoạch khắc phục và giữ khách.",
d:[["Mr. Harris","Quan, we've sent out two hundred invoices with the wrong VAT. This is completely unacceptable.","Quan, chúng tôi đã gửi 200 hóa đơn sai VAT. Điều này hoàn toàn không chấp nhận được."],
["Quan","You're absolutely right, and I apologise. This should never have happened, and we take full responsibility.","Anh hoàn toàn đúng, tôi xin lỗi. Lẽ ra việc này không được xảy ra, và chúng tôi nhận toàn bộ trách nhiệm."],
["Mr. Harris","What are you going to do about it?","Các anh sẽ làm gì?"],
["Quan","We've already identified the cause: a tax code was mapped incorrectly during data migration. It was corrected this morning, and no new invoices are affected.","Chúng tôi đã xác định nguyên nhân: một mã thuế bị ánh xạ sai khi chuyển đổi dữ liệu. Đã sửa sáng nay, hóa đơn mới không bị ảnh hưởng."],
["Mr. Harris","And the two hundred invoices already sent?","Còn 200 hóa đơn đã gửi?"],
["Quan","Our team will issue corrected invoices by tomorrow evening, and I'll send you a full incident report with the steps we're taking to prevent this from happening again.","Nhóm chúng tôi sẽ xuất hóa đơn điều chỉnh trước tối mai, và tôi sẽ gửi báo cáo sự cố đầy đủ kèm các bước ngăn việc này tái diễn."]],
p:[["We take full responsibility.","Chúng tôi nhận toàn bộ trách nhiệm."],["This should never have happened.","Lẽ ra việc này không được xảy ra."],["We've already identified the cause.","Chúng tôi đã xác định được nguyên nhân."],["A tax code was mapped incorrectly.","Một mã thuế bị ánh xạ sai."],["to prevent this from happening again","để ngăn việc này tái diễn"]],
rp:[{w:"Mr. Harris",s:"How could your team make such a basic mistake?",o:[["There's no excuse for it. Let me explain what went wrong and, more importantly, what we're doing to fix it.",1,"Tốt: không biện minh, chuyển sang giải pháp."],["Actually, your team approved the tax mapping.",0,"Có thể đúng, nhưng đổ lỗi lúc khách đang giận chỉ làm căng hơn. Nêu sau trong báo cáo sự cố."],["Mistakes happen in every project.",0,"Xem nhẹ ảnh hưởng tới khách."]]},
{w:"Mr. Harris",s:"I want a discount on the next phase.",o:[["I understand why you'd ask. I can't commit to that on this call, but I'll raise it with our director and come back to you by Friday.",1,"Tốt: không hứa vượt thẩm quyền, có cam kết thời gian."],["No, that's not possible.",0,"Từ chối thẳng khi khách đang bực."],["Sure, fifty percent off.",0,"Nhượng bộ quá mức, vượt thẩm quyền."]]},

{t:"Hedging and diplomatic language",lv:"C1",x:"Ở C1, nói đúng chưa đủ mà phải nói khéo. Rào đón (hedging) giúp bạn nêu ý kiến hoặc phản đối mà không gây đối đầu: It seems/appears that, would seem to, tend to, arguably, to some extent, I'm not entirely convinced, You might want to.",f:"would seem to + V   |   tend to + V   |   I'm not entirely convinced that...   |   You might want to...",

{t:"Leadership talk: leading through change",vi:"Bài nói: lãnh đạo qua giai đoạn thay đổi",type:"Bài nói chuyên đề",lv:"C1",ac:{Speaker:"en-AU"},
d:[["Speaker","When we rolled out our new ERP system, I made a mistake that I suspect many leaders make. I assumed that if the system was good, people would naturally want to use it."],
["Speaker","They didn't. Within a month, half of the finance team had gone back to their spreadsheets, and our reports were less reliable than before."],
["Speaker","What I eventually realised was that resistance to change is rarely about the technology itself. It's about people feeling that they've lost control, or that their expertise no longer counts."],
["Speaker","So we changed our approach. Rather than training everyone at once, we identified a small group of respected colleagues in each team and made them champions. They tested new features first and shared tips with their peers."],
["Speaker","We also stopped measuring success purely by system usage. Instead, we asked teams what had become easier, and we shared those stories in every monthly meeting."],
["Speaker","Within three months, spreadsheet use had dropped by eighty percent. More importantly, people were suggesting improvements to the system themselves."],
["Speaker","If there's one lesson I'd pass on, it's this: people don't resist change; they resist being changed. Involve them early, and they'll carry the project for you."]],

{q:"According to the speaker, resistance to change is mainly about...",o:["people feeling a loss of control or value","the cost of the technology","poor internet connections","a lack of time"]},
{q:"What role did the 'champions' play?",o:["Testing features first and helping colleagues","Reporting problems to management","Writing the training manual","Replacing the finance team"]},
{q:"How did they measure success after changing their approach?",o:["By asking teams what had become easier","Only by system usage","By counting training hours","By the number of complaints"]},
{q:"What does 'people resist being changed' mean?",o:["People dislike change forced on them without involvement","People never accept new systems","People prefer old technology","People want to change jobs"]}]}

{lv:"C1",t:"Confirm negotiated terms",vi:"Email xác nhận điều khoản sau đàm phán",type:"Email trang trọng C1",min:180,max:240,
task:"After a meeting with an ERP vendor, write an email to their sales director, Mark, summarising the terms you agreed and the points that are still open.",
pts:["Thank him and state the purpose","Summarise the agreed terms (price, contract length, training)","State the open points clearly","Set out next steps with a deadline","Make clear that agreement is subject to internal approval"],
phr:["Further to our meeting on..., I am writing to confirm...","Subject to approval by our CFO, we agreed in principle to...","In return, we will...","However, two points remain open. Firstly,... Secondly,...","I would be grateful if you could send a revised proposal by..."],
s:"Dear Mark,\n\nThank you for meeting with us on Tuesday. Further to our discussion, I am writing to confirm the main terms we agreed and to outline the points that remain open.\n\nSubject to approval by our CFO, we agreed in principle to a three-year licence for 120 users at a fee eight percent below your original proposal. In return, we will commit to the full term and pay quarterly in advance. You also confirmed that end-user training for up to forty staff will be included at no additional cost.\n\nHowever, two points remain open. Firstly, we would need the service level agreement to include a four-hour response time for critical issues, together with service credits if this is not met. Secondly, we would like clarification on how future upgrades will be priced, as this was not covered in the draft agreement.\n\nI would be grateful if you could send a revised proposal reflecting these points by Friday 14 March, so that we can present it to our board the following week.\n\nThank you again for your flexibility. I look forward to finalising the agreement.\n\nKind regards,\nLinh Tran\nHead of Finance Systems"},
{lv:"C1",t:"Business case for an ERP module",vi:"Đề xuất mua phân hệ ERP (business case)",type:"Đề xuất nội bộ C1",min:180,max:240,
task:"Write an internal proposal to your CFO, Mr. Wong, recommending the purchase of an automated bank reconciliation module.",
pts:["Describe the current problem with evidence","Explain the proposed solution","Give costs and expected return","Identify the main risk and how to mitigate it","End with a clear recommendation"],
phr:["At present, ...","I would therefore recommend...","The total cost is estimated at...","Based on..., the investment should pay for itself within...","The main risk lies in... To mitigate this, I propose..."],
s:"Dear Mr. Wong,\n\nProposal: automated bank reconciliation module\n\nAt present, our team reconciles twelve bank accounts manually every month. This takes approximately sixty hours and is a major reason why month-end close takes eight working days. Last quarter, two discrepancies were only identified after the reporting deadline.\n\nI would therefore recommend purchasing the automated reconciliation module offered by our current ERP vendor. The module matches bank transactions with ledger entries automatically and flags exceptions for review, allowing the team to focus on investigating discrepancies rather than matching transactions line by line.\n\nThe total cost is estimated at USD 18,000 in the first year, including implementation, and USD 6,000 annually thereafter. Based on a saving of fifty hours per month, the investment should pay for itself within fourteen months, while also shortening the close by at least two days.\n\nThe main risk lies in the quality of our bank data. To mitigate this, I propose a four-week pilot with our two largest accounts before full rollout.\n\nGiven the potential savings and the improvement in reporting accuracy, I would welcome the opportunity to discuss this proposal at your convenience.\n\nKind regards,\nMai Nguyen\nAccounting Manager"},
{lv:"C1",t:"Escalation: project delay",vi:"Thông báo dự án trễ go-live cho khách",type:"Email trang trọng C1",min:180,max:240,
task:"Your ERP project will miss its go-live date. Write to the client's finance director, Ms. Tan, explaining the situation.",
pts:["State the issue clearly in the first paragraph","Explain the cause without blaming the client","Give the impact and the new timeline","Describe actions to reduce the impact","Offer a call or meeting"],
phr:["I am writing to inform you that...","Although the issue originates from..., it is our responsibility to resolve it.","Our current estimate is that...","To reduce the impact further, we will...","I appreciate that this is disappointing news."],
s:"Dear Ms. Tan,\n\nI am writing to inform you that we will not be able to go live on 1 April as planned, and to explain how we propose to minimise the impact on your team.\n\nDuring final testing last week, we identified errors in the way intercompany transactions are posted between your three subsidiaries. Although the issue originates from the data migration, it is our responsibility to resolve it, and we should have detected it earlier.\n\nOur current estimate is that the corrections and a further round of testing will require two additional weeks, which would move go-live to 15 April. This date still allows your team to complete the March close in the legacy system, so we do not expect any disruption to your quarterly reporting.\n\nTo reduce the impact further, we will assign two additional consultants to the project at no extra cost and provide daily progress updates to your project manager until go-live.\n\nI appreciate that this is disappointing news, and I would welcome the opportunity to discuss it with you in person. Would you be available for a call on Thursday or Friday this week?\n\nYours sincerely,\nHuy Pham\nProject Director"},
{lv:"C1",t:"Announce a change to your team",vi:"Thông báo thay đổi quy trình cho team",type:"Email lãnh đạo C1",min:180,max:240,
task:"You are introducing a second approval step for large supplier payments in the finance department. Write an email to your team explaining the change and gaining their support.",
pts:["Say what is changing and when","Explain why, with evidence","Explain how it affects them in practice","Describe the support available","Invite feedback"],
phr:["I would like to let you know about a change to...","I know this adds a step, so I want to explain the reasoning behind it.","In practice, the change will affect...","To make sure it does not slow us down, ...","I would genuinely value your input."],
s:"Dear team,\n\nI would like to let you know about a change to the way we approve supplier payments, which will come into effect on 1 June.\n\nFrom that date, all payments above USD 10,000 will require approval from two people in the ERP system rather than one. I know this adds a step to a process that already feels busy, so I want to explain the reasoning behind it.\n\nLast quarter, we made duplicate payments totalling more than USD 12,000. In each case, the error was caught only during reconciliation, weeks after the money had left our account. A second approval is a simple control that would have prevented every one of these cases, and it is also something our auditors have recommended.\n\nIn practice, the change will affect around fifteen percent of payments. To make sure it does not slow us down, Khoa will run two short training sessions next week, and approvers will receive automatic reminders in the system.\n\nI would genuinely value your input. If you can see a way to make the process smoother, please raise it at our team meeting on Friday or send me a message directly.\n\nThank you for your support.\n\nBest regards,\nNam"}
);

const LT_C1_TEXT="<b>Why ERP projects fail</b><br><br>Industry surveys consistently suggest that a significant proportion of ERP projects exceed their budgets or fail to deliver the expected benefits. Tempting as it is to blame the software, the root causes tend to lie elsewhere.<br><br>The most common culprit is unclear ownership. When an ERP project is perceived as an 'IT project', business leaders often disengage, leaving technical teams to make decisions about processes they do not fully understand. The result is a system that works as designed but not as the business needs.<br><br>A second factor is excessive customisation. Organisations frequently try to replicate their existing processes in the new system rather than adapting to standard practice. Each customisation may seem justified in isolation, yet collectively they increase cost, complicate upgrades and lock the organisation into its old ways of working.<br><br>Finally, change management is routinely underfunded. Training is often reduced to a few sessions shortly before go-live, by which point resistance has already formed. Successful projects, by contrast, treat user involvement as a continuous process that begins during requirement gathering.";
const LT_C2_TEXT="<b>The illusion of precision</b><br><br>Few artefacts of corporate life inspire as much misplaced confidence as the financial forecast. Presented to two decimal places and wrapped in the language of models and scenarios, forecasts project an authority that their underlying assumptions rarely warrant.<br><br>The problem is not that forecasts are wrong (they almost invariably are) but that their apparent precision discourages scrutiny. A revenue projection of 14.27 million invites debate about the decimal point rather than about whether the market will grow at all.<br><br>Some finance leaders have responded by abandoning point estimates altogether in favour of ranges and explicitly stated assumptions. This approach is less satisfying to boards accustomed to a single number, yet it arguably produces better decisions, since it forces discussion of what would have to be true for a given outcome to materialise.<br><br>None of this implies that forecasting is futile. Rather, its value lies less in the number it produces than in the conversations it provokes.";

function norm(s){s=" "+s.toLowerCase().replace(/[’‘]/g,"'")+" ";
s=s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would").replace(/\bi'm\b/g,"i am").replace(/\blet's\b/g,"let us").replace(/'s\b/g," is");
s=s.replace(/%/g," percent").replace(/(\d)([a-z])/g,"$1 $2").replace(/[^a-z0-9' ]+/g," ");
return s.split(/\s+/).filter(Boolean).map(w=>NUM[w]||w.replace(/^'+|'+$/g,"")).filter(Boolean)}
function scoreIt(target,heard){const words=target.split(/\s+/);const toks=[],own=[];words.forEach((w,i)=>norm(w).forEach(t=>{toks.push(t);own.push(i)}));const h=norm(heard);const n=toks.length,m=h.length;
const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=toks[i]===h[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(toks[i]===h[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
const wok=words.map(()=>true);toks.forEach((t,x)=>{if(!hit[x])wok[own[x]]=false});
const extra=Math.max(0,m-dp[0][0]);let sc=n?dp[0][0]/n:0;sc=Math.max(0,sc-Math.min(.15,extra*0.03));
return{score:sc,words,wok,heard}}

function escRe(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function clozeOf(c){const toks=c.w.split(/\s+/).map(t=>{let r=escRe(t);if(/y$/i.test(t))r=r.slice(0,-1)+"(?:y|i)";else if(/e$/i.test(t))r=r.slice(0,-1)+"(?:e)?";return r+"[a-z]*"});
try{const m=c.x.match(new RegExp("\\b"+toks.join("\\s+")+"\\b","i"));if(!m)return null;return{form:m[0],text:c.x.slice(0,m.index)+"_____"+c.x.slice(m.index+m[0].length)}}catch(e){return null}}
function cardMode(c){if(wb(c.w)<2)return{m:"flip"};const cz=clozeOf(c);if(cz&&Math.random()<.5)return{m:"cloze",cz};return{m:"type"}}

const nrm2=t=>nrm(t).replace(/[ '-]/g,"");
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

else pool=shuffle(ALLW.filter(w=>w.ti===ti)).sort((a,b)=>wb(a.w)-wb(b.w)).slice(0,15);

function fcCheck(giveUp){const c=FC.list[FC.i],cm=FC.cm;const e=document.getElementById("fin");const typed=giveUp?"":(e?e.value:"");if(!giveUp&&!typed.trim()){e&&e.focus();return}
const ans=cm.m==="cloze"?cm.cz.form:c.w;const a=nrm2(typed),b=nrm2(ans),base=nrm2(c.w);let ok=false,msg;
if(giveUp)msg="Chưa nhớ, sẽ quay lại sau";else if(a===b){ok=true;msg="Chính xác"}else if(cm.m==="cloze"&&a===base){ok=true;msg="Đúng từ, nhưng trong câu cần chia đúng dạng"}else if(b.length>=4&&lev(a,b)<=1)msg="Gần đúng, sai một ký tự. Tính là sai để bạn ôn lại.";else msg="Chưa đúng";

function fcMark(ok){const c=FC.list[FC.i];const t=dayIdx();const cur=S.w[c.w]||{b:0,d:t};const wasDue=!S.w[c.w]||cur.d<=t;
if(wasDue&&S.w[c.w]&&INT[cur.b]>=7){S.ret.n++;if(ok)S.ret.ok++}
if(ok){if(wasDue){cur.b=Math.min(5,cur.b+1);cur.d=t+INT[cur.b]}FC.known++;addXP(1)}
else{cur.b=0;cur.d=t;if(!FC.re[c.w]){FC.re[c.w]=1;FC.list.push(c)}}
S.w[c.w]=cur;save();FC.i++;FC.flip=false;FC.res=null;if(FC.i<FC.list.length)FC.cm=cardMode(FC.list[FC.i]);render();fcAfter()}
