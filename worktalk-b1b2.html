const nk={B1:"B2",B2:"C1",C1:"C2"}[k];const next=nk?'<button class="btn hv" onclick="startLT(\''+nk+'\')">Làm bài kiểm tra lên '+nk+'</button>':"";
return '<div class="card result"><div class="num">'+r.right+'/'+r.n+'</div><div class="lvl">'+(pass?"Đã qua "+k:"Chưa qua "+k)+'</div><p class="note">'+(pass?(k==="C2"?"Bạn đã qua bài C2 trong app. Bài này chỉ đo ngữ pháp, từ vựng, đọc và nghe. Muốn có kết quả chính thức cho công việc, hãy cân nhắc C1 Advanced, C2 Proficiency hoặc IELTS 7.5 trở lên.":k==="B2"?"Bạn đã qua B2. Bài kiểm tra lên C1 đã mở. Nếu công việc cần đàm phán và báo cáo chuyên ngành, hãy chuyển mục tiêu sang C1–C2 ở trang chính.":"Bạn đã qua "+k+". Bài kiểm tra lên "+nk+" đã được mở."):"Cần đúng từ "+T0.need+"/"+r.n+". Phần yếu nhất: "+esc(weak.n)+". Học thêm 1–2 tuần rồi làm lại.")+'</p><div class="brk">'+
secs.map(x=>'<div><span>'+esc(x.n)+'</span><span class="bar"><i style="width:'+Math.round(x.v*100)+'%"></i></span><b>'+Math.round(x.v*100)+'%</b></div>').join("")+'</div>'+
(wrong.length?'<details style="text-align:left"><summary>Xem '+wrong.length+' câu sai</summary><ul style="margin:8px 0 0;padding-left:18px">'+wrong.map(x=>'<li style="margin-bottom:6px">'+esc(x.q)+'<br><small>Bạn chọn: '+esc(x.ch)+'. Đáp án: <b>'+esc(x.cor)+'</b></small></li>').join("")+'</ul></details>':"")+
'<div class="row" style="justify-content:center;margin-top:10px">'+(pass?next:"")+(pass&&k==="B2"&&S.goal!=="c1"?'<button class="btn ghost" onclick="S.goal=\'c1\';save();quitQuiz()">Chuyển mục tiêu sang C1–C2</button>':"")+'<button class="btn ghost" onclick="quitQuiz()">Về trang thi</button></div></div>'}})}

const SEC=[["Phần 1: Ngữ pháp và từ vựng","Ngữ pháp, từ vựng"],["Phần 2: Đọc","Đọc"],["Phần 3: Nghe","Nghe"],["Phần 4: Viết","Viết"],["Phần 5: Nói","Nói"]];
const lvlOf=p=>p>=80?"B2":p>=65?"B1+":p>=45?"B1":"Dưới B1";
function vTest(){const hist=S.mock.slice(-6).reverse();
return '<h1 class="pg">Thi thử</h1>'+ladderHTML()+
'<div class="card"><b>Thi thử đủ 5 kỹ năng (khoảng 40–50 phút)</b><p class="note">Mô phỏng cấu trúc kiểu Aptis: Ngữ pháp và từ vựng (30 câu), Đọc (2 bài), Nghe (7 câu), Viết (1 email, tự chấm theo tiêu chí), Nói (2 câu đọc to, 2 câu trả lời tự do).</p><p class="note">Mỗi lần thi, câu hỏi được rút từ kho, ưu tiên câu bạn chưa gặp, nên làm lại vẫn đo được tiến bộ. Kho hiện đủ cho khoảng 2–3 đề khác nhau. Đây không phải đề chính thức và chưa được chuẩn hóa.</p><button class="btn hv big" onclick="startMock()">Bắt đầu thi thử</button></div>'+
(hist.length?'<h2 style="font-size:18px;margin:16px 0 6px">Lịch sử thi thử</h2><ul class="wlist">'+hist.map(m=>'<li><span><b>'+esc(m.lvl)+'</b> <small>'+m.pct+'%</small>'+(m.sk?'<br><small>'+Object.entries(m.sk).map(([k,v])=>esc(k)+" "+v+"%").join(", ")+'</small>':"")+'</span><small>'+esc(m.d)+'</small></li>').join("")+'</ul>':"")}
function pick(pool,n,pre){const sc=pool.map((x,i)=>({x,i,r:Math.random(),seen:S.mseen[pre+i]?1:0})).sort((a,b)=>(a.seen-b.seen)||(a.r-b.r)).slice(0,n);sc.forEach(o=>S.mseen[pre+o.i]=1);return sc.map(o=>o.x)}
function startA2(){startQuiz({title:"Kiểm tra nền tảng A2",items:A2,back:"test",done:r=>{S.a2=r.right;const ok=r.right>=8;if(ok)S.lvl.A2=1;S.lvlLog.push({k:"A2",s:r.right,n:10,d:dstr(new Date())});save();addXP(r.right);
return '<div class="card result"><div class="num">'+r.right+'/10</div><div class="lvl">'+(ok?"Nền A2 vững":"Cần củng cố A2")+'</div><p class="note">'+(ok?"Bạn đã sẵn sàng cho nội dung B1–B2 trong app.":"Nên ôn lại thì hiện tại, quá khứ, so sánh hơn, giới từ cơ bản trước, rồi quay lại. Bạn vẫn có thể học tiếp, nhưng sẽ thấy B1 khá khó.")+'</p><div class="row" style="justify-content:center">'+(ok?'<button class="btn hv" onclick="startLT(\'B1\')">Làm bài kiểm tra lên B1</button>':'')+'<button class="btn ghost" onclick="go(\'test\')">Về trang thi</button></div></div>'}})}
function startMock(){const it=[],add=(sec,arr,extra)=>arr.forEach(x=>it.push(Object.assign({sec},extra||{},x)));
add(SEC[0][0],pick(MOCK_G.concat(MOCK_G2),18,"g"));add(SEC[0][0],pick(MOCK_V.concat(MOCK_V2),12,"v"));
const em=pick(READ_POOL.filter(r=>r.kind==="email"),1,"re")[0],ar=pick(READ_POOL.filter(r=>r.kind==="article"),1,"ra")[0];
add(SEC[1][0],em.q,{passage:em.p});add(SEC[1][0],ar.q,{passage:ar.p});
add(SEC[2][0],pick(MOCK_L.concat(MOCK_L3),4,"l"));add(SEC[2][0],pick(VM_POOL,1,"vm")[0]);
it.push({sec:SEC[3][0],write:pick(WRITE_POOL,1,"w")[0]});
pick(READ_ALOUD,2,"s").forEach(x=>it.push({sec:SEC[4][0],speak:x}));
pick(FREE_POOL,2,"f").forEach(([q,m])=>it.push({sec:SEC[4][0],free:q,min:m}));save();
startQuiz({title:"Thi thử B1–B2",items:it,back:"test",silent:true,done:r=>{
const res=SEC.map(([k,n])=>{const s=r.sec[k];return{n,v:s&&s.n?s.r/s.n:null}});const have=res.filter(x=>x.v!=null);
const pct=Math.round(have.reduce((a,x)=>a+x.v,0)/Math.max(1,have.length)*100);const lvl=lvlOf(pct);
const d=new Date();const sk={};res.forEach(x=>{if(x.v!=null)sk[x.n]=Math.round(x.v*100)});S.mock.push({d:d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear(),pct,lvl,sk});save();addXP(30);
const weak=have.slice().sort((a,b)=>a.v-b.v)[0];
const tip={"Ngữ pháp, từ vựng":"Ôn từ vựng mỗi ngày và làm lại các chủ điểm ngữ pháp chưa đạt.","Đọc":"Đọc email và bài báo ngắn, gạch chân từ khóa trong câu hỏi trước khi đọc.","Nghe":"Làm các bài nghe dài, đọc câu hỏi trước rồi mới nghe, sau đó nói theo lời thoại.","Viết":"Viết mỗi tuần 2 email ở tab Viết, so với bài mẫu và chú ý từ nối.","Nói":"Shadowing các hội thoại và nhập vai mỗi ngày, cố nói câu dài hơn."};
return '<div class="card result"><p class="note">Mức ước lượng</p><div class="lvl">'+lvl+'</div><div class="num">'+pct+'%</div><div class="brk">'+
res.map(x=>x.v==null?'<div><span>'+x.n+'</span><span class="note" style="grid-column:span 2">Không tính (bỏ qua hoặc trình duyệt không hỗ trợ)</span></div>':'<div><span>'+x.n+'</span><span class="bar"><i style="width:'+Math.round(x.v*100)+'%"></i></span><b>'+lvlOf(x.v*100)+'</b></div>').join("")+
'</div><p class="note">Kỹ năng yếu nhất: <b>'+esc(weak.n)+'</b>. '+esc(tip[weak.n])+'</p><p class="note">Viết là điểm tự chấm, Nói chỉ đo độ rõ và độ dài. Muốn biết trình độ chính xác, bạn cần thi chứng chỉ thật.</p><div class="row" style="justify-content:center"><button class="btn ghost" onclick="quitQuiz()">Quay lại</button><button class="btn hv" onclick="go(\'home\')">Về kế hoạch hôm nay</button></div></div>'}})}

/* ===================== SYNC (đổi máy) ===================== */
let SYNC={code:"",msg:""};
function b64u(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const bin=atob(str);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function makeCode(){const data=JSON.stringify(Object.assign({v:1,at:Date.now()},S));
if(window.CompressionStream){const cs=new Blob([data]).stream().pipeThrough(new CompressionStream("gzip"));return "WT1."+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}
return "WT0."+b64u(new TextEncoder().encode(data))}
async function readCode(code){code=(code||"").trim().replace(/\s+/g,"");const pre=code.slice(0,4),u=unb64u(code.slice(4));let txt;
if(pre==="WT1."){if(!window.DecompressionStream)throw new Error("Trình duyệt này quá cũ để đọc mã nén. Hãy cập nhật trình duyệt.");txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
else if(pre==="WT0.")txt=new TextDecoder().decode(u);else throw new Error("Mã không đúng định dạng. Mã luôn bắt đầu bằng WT1. hoặc WT0.");
const o=JSON.parse(txt);if(!o||o.v!==1)throw new Error("Mã không hợp lệ.");return o}
function mergeS(o){const t=S;const dn=x=>{if(!x)return 0;const [y,m,d]=String(x).split("-").map(Number);return y*10000+m*100+d};
t.xp=Math.max(t.xp||0,o.xp||0);
if(dn(o.last)>dn(t.last)){t.last=o.last;t.streak=o.streak||0}else if(o.last===t.last)t.streak=Math.max(t.streak||0,o.streak||0);
["sc","gr","mseen","lvl"].forEach(k=>Object.keys(o[k]||{}).forEach(x=>{if(o[k][x])t[k][x]=o[k][x]}));
["ls","ext"].forEach(k=>Object.keys(o[k]||{}).forEach(x=>{t[k][x]=Math.max(t[k][x]||0,o[k][x]||0)}));
Object.keys(o.wr||{}).forEach(x=>{const a=t.wr[x],b=o.wr[x];if(!a||(b.done&&!a.done)||(!a.done&&(b.t||"").length>(a.t||"").length))t.wr[x]=b});
Object.keys(o.w||{}).forEach(x=>{const a=t.w[x],b=o.w[x];if(!a||b.b>a.b||(b.b===a.b&&b.d>a.d))t.w[x]=b});
Object.keys(o.err||{}).forEach(x=>{if(!t.err[x])t.err[x]=o.err[x]});
Object.keys(o.grR||{}).forEach(x=>{const a=t.grR[x],b=o.grR[x];if(!a||b.b>a.b)t.grR[x]=b});
Object.keys(o.grLog||{}).forEach(x=>{t.grLog[x]=Object.assign({},o.grLog[x],t.grLog[x]||{})});
const key=m=>[m.d,m.pct,m.lvl,m.k,m.s].join("|");
["mock","lvlLog"].forEach(k=>{const seen=new Set((t[k]||[]).map(key));(o[k]||[]).forEach(m=>{if(!seen.has(key(m))){t[k].push(m);seen.add(key(m))}});t[k]=t[k].slice(-40)});
if(o.a2!=null)t.a2=Math.max(t.a2||0,o.a2);if(o.ret&&o.ret.n>(t.ret.n||0))t.ret=o.ret;save()}
function vSync(){return '<button class="back" onclick="go(\'home\')">‹ Hôm nay</button><h1 class="pg">Chuyển tiến độ</h1>'+
'<p class="note">App không có tài khoản hay máy chủ, nên tiến độ nằm trong trình duyệt của từng máy. Để chuyển, bạn tạo một <b>mã chuyển</b> ở máy cũ rồi dán vào máy mới. Mã chứa toàn bộ tiến độ (từ vựng, ngữ pháp, bài viết nháp...), nên khá dài: hãy gửi cho chính bạn qua Zalo, Messenger hoặc email, hoặc tải thành file.</p>'+
'<div class="card"><b>Bước 1. Ở máy đang có tiến độ</b><div class="row" style="margin-top:8px"><button class="btn hv" onclick="syncMake()">Tạo mã chuyển</button></div>'+
(SYNC.code?'<textarea id="scode" readonly style="min-height:120px;font-family:monospace;font-size:12px">'+esc(SYNC.code)+'</textarea><p class="note">'+SYNC.code.length.toLocaleString()+' ký tự. Mã được tạo lúc '+new Date().toLocaleTimeString()+'.</p><div class="row"><button class="btn" onclick="syncCopy()">Sao chép mã</button><button class="btn ghost" onclick="syncFile()">Tải file mã</button></div>':"")+'</div>'+
'<div class="card"><b>Bước 2. Ở máy mới</b><p class="note">Dán mã vào đây, hoặc chọn file mã đã tải. Tiến độ sẽ được <b>gộp</b>: mỗi phần giữ kết quả tốt hơn của hai máy, không xóa gì.</p><textarea id="sin" placeholder="Dán mã bắt đầu bằng WT1. ở đây..." style="min-height:100px;font-family:monospace;font-size:12px"></textarea><div class="row" style="margin-top:8px"><button class="btn hv" onclick="syncImport()">Nhập tiến độ</button><label class="btn ghost" style="cursor:pointer">Chọn file<input type="file" accept=".txt,text/plain" style="display:none" onchange="syncReadFile(this)"></label></div>'+(SYNC.msg?'<div class="fb '+(SYNC.ok?"ok":"bad")+'">'+esc(SYNC.msg)+'</div>':"")+'</div>'+
'<p class="note">Mẹo: học chủ yếu trên một máy, và tạo mã mới mỗi lần đổi sang máy kia. Muốn đồng bộ tự động bằng một mã ngắn thì app cần có máy chủ (ví dụ Firebase), có thể làm ở bản sau.</p>'}
async function syncMake(){try{SYNC.code=await makeCode();SYNC.msg="";render()}catch(e){toast("Không tạo được mã: "+e.message)}}
async function syncCopy(){try{await navigator.clipboard.writeText(SYNC.code);toast("Đã sao chép mã")}catch(e){const t=document.getElementById("scode");if(t){t.select();try{document.execCommand("copy");toast("Đã sao chép mã")}catch(x){toast("Hãy bôi đen mã và sao chép thủ công")}}}}
function syncFile(){const b=new Blob([SYNC.code],{type:"text/plain"});const a=document.createElement("a");const d=new Date();a.href=URL.createObjectURL(b);a.download="worktalk-tien-do-"+d.getFullYear()+(d.getMonth()+1)+d.getDate()+".txt";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function syncImport(txt){const v=txt!=null?txt:(document.getElementById("sin")||{}).value;if(!v||!v.trim()){toast("Hãy dán mã trước");return}
try{const o=await readCode(v);const before=learned();mergeS(o);SYNC.ok=true;SYNC.msg="Đã gộp tiến độ từ mã tạo lúc "+new Date(o.at).toLocaleString()+". Từ đã thuộc: "+before+" → "+learned()+"."}catch(e){SYNC.ok=false;SYNC.msg="Không đọc được mã. "+(e.message||"")}render()}
function syncReadFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>syncImport(String(r.result));r.readAsText(f)}

render();
</script>
